<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Val?</title>
    <link id="favicon" rel="icon" href="val.png" type="image/png">
<link rel="icon" href="val.png" sizes="32x32">
<link rel="icon" href="val.png" sizes="192x192">
<link rel="apple-touch-icon" href="val.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            text-align: center;
            color: #5d4037;
            position: relative;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #bg-container,
        #bg-old {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.2s ease-in-out;
            z-index: -2;
        }

        #bg-old {
            z-index: -3;
            opacity: 0;
        }

        #hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #hearts-container.active {
            opacity: 1;
        }

        .heart {
            position: absolute;
            width: 24px;
            height: 24px;
            opacity: 0.45;
            animation: floatUp linear infinite;
            will-change: transform, opacity;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15));
        }

        .heart svg {
            width: 100%;
            height: 100%;
        }

        @keyframes floatUp {
            0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.5; }
            100% { transform: translateY(-50vh) rotate(540deg); opacity: 0; }
        }

        img {
            max-width: 90vw;
            max-height: 38vh;
            width: auto;
            height: auto;
            display: block;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            z-index: 10;
            position: relative;
            pointer-events: none;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            margin: 10px 0 30px 0;
            color: #c1121f;
            text-shadow: 2px 2px 0px #fff, 4px 4px 12px rgba(193, 18, 31, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.2;
            z-index: 10;
            position: relative;
        }

        #status-text {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #c1121f;
            font-weight: 600;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            background: transparent;
            border: none;
        }

        #status-text.visible {
            opacity: 1;
        }

        .happy-text {
            color: #c1121f;
            font-size: 3.5rem;
            display: none;
            z-index: 20;
            position: relative;
            line-height: 1.1;
            text-shadow: 2px 2px 0 #fff, 0 0 15px rgba(193, 18, 31, 0.5);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .btn-group {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 24px;
            z-index: 20;
            position: relative;
            padding: 20px 10px;
            min-height: 90px;
            width: 100%;
            max-width: 90vw;
            box-sizing: border-box;
            background: transparent;
        }

        button {
            padding: 16px 48px;
            font-size: 1.35rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
            position: relative;
            overflow: hidden;
            min-width: 130px;
        }

        .btn-yes {
            background-color: #e63946;
            color: white;
            border: 2px solid #d00000;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            animation: gentlePulse 2.3s infinite ease-in-out;
        }

        .btn-yes:hover {
            background-color: #d00000;
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.45);
        }

        .btn-no {
            background-color: #ffffff;
            color: #e63946;
            border: 2px solid #e63946;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
            white-space: nowrap;
        }

        .btn-no:hover {
            background-color: #fff5f5;
            color: #d00000;
            transform: scale(1.04) translateY(-1px);
            box-shadow: 0 7px 18px rgba(214, 51, 132, 0.3);
        }

        .btn-no:active {
            transform: scale(0.94);
            background-color: #ffebee;
        }

        .shake {
            animation: shake 0.6s infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-2px, -2px) rotate(-2deg); }
            20% { transform: translate(-3px, 0px) rotate(2deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(2px, -1px) rotate(-2deg); }
            50% { transform: translate(-1px, 2px) rotate(2deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-2deg); }
            80% { transform: translate(-1px, -2px) rotate(2deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(-2deg); }
        }

        /* WHATSAPP PROMPT STYLING */
        #whatsapp-prompt {
            display: none;
            margin-top: 40px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #whatsapp-prompt.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 36px;
            background: white;
            color: #c1121f;
            border: 2px solid #e63946;
            border-radius: 999px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            box-shadow: 0 8px 24px rgba(193, 18, 31, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: gentlePulse 3s infinite ease-in-out;
        }

        .whatsapp-btn:hover {
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 12px 32px rgba(193, 18, 31, 0.45);
            background: #fff5f5;
        }

        .whatsapp-btn svg {
            width: 32px;
            height: 32px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; margin: 8px 0 20px 0; }
            .btn-group { gap: 16px; padding: 16px 12px; }
            button { padding: 14px 36px; font-size: 1.2rem; min-width: 120px; }
            .happy-text { font-size: 2.8rem; }
            img { max-height: 34vh; margin-bottom: 16px; }
            .whatsapp-btn { padding: 14px 28px; font-size: 1.05rem; gap: 10px; }
            #whatsapp-prompt { margin-top: 30px; }
        }

        @media (pointer: coarse) {
            button { padding: 18px 44px; font-size: 1.35rem; min-width: 140px; }
            .btn-group { gap: 24px; }
            .whatsapp-btn { padding: 18px 40px; font-size: 1.1rem; }
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div id="bg-old"></div>
    <div id="hearts-container"></div>
    <canvas id="confetti-canvas"></canvas>

    <img id="valentine-img" src="beg.gif" alt="Cute Pleading">

    <h1 id="main-title">Will you be my Val?</h1>
    
    <h1 id="success-msg" class="happy-text">Yay! I Love You!</h1>

    <div id="whatsapp-prompt">
        <a id="whatsapp-btn" class="whatsapp-btn" href="#" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.297-.497.099-.198.05-.371-.025-.52-.074-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884" fill="#c1121f"/>
            </svg>
            <span>Message me ❤️</span>
        </a>
    </div>

    <div class="btn-group" id="btn-container">
        <button class="btn-yes" id="yesBtn">Yes</button>
        <button class="btn-no" id="noBtn">No</button>
    </div>

    <div id="status-text"></div>

    <script>
        // CONFIG
        const imgConfig = {
            sadMobile: 'no-mobile.jpg',
            sadDesktop: 'no-desktop.jpg',
            happyMobile: 'yes-mobile.jpg',
            happyDesktop: 'yes-desktop.jpg',
            begGif: 'beg.gif', 
            yayGif: 'yay.gif'  
        };

        // BACKGROUNDS
        const bgActive = document.getElementById('bg-container');
        const bgPrevious = document.getElementById('bg-old');

        function updateBackground(mood) {
            const isMobile = window.innerWidth < 768;
            let newUrl = '';

            if (mood === 'sad') {
                newUrl = isMobile ? imgConfig.sadMobile : imgConfig.sadDesktop;
            } else if (mood === 'happy') {
                newUrl = isMobile ? imgConfig.happyMobile : imgConfig.happyDesktop;
            }

            if (!newUrl || bgActive.style.backgroundImage === `url("${newUrl}")`) return;

            bgPrevious.style.backgroundImage = bgActive.style.backgroundImage || 'none';
            bgPrevious.style.opacity = 1;

            bgActive.style.opacity = 0;

            setTimeout(() => {
                bgActive.style.backgroundImage = `url("${newUrl}")`;
                bgActive.style.opacity = 1;

                setTimeout(() => {
                    bgPrevious.style.opacity = 0;
                }, 1300);
            }, 100);
        }

        function preloadImages() {
            [...Object.values(imgConfig)].forEach(src => new Image().src = src);
        }

        preloadImages();
        setTimeout(() => updateBackground('sad'), 150);

        // HEARTS
        const heartSVGs = [
            `<svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g1"><stop offset="0%" stop-color="#e63946"/><stop offset="100%" stop-color="#c1121f"/></linearGradient></defs><path fill="url(#g1)" d="M23.6,0c-3.4,0-6.3,1.4-8.3,3.7C13.7,1.4,10.8,0,7.4,0C3.3,0,0,3.3,0,7.4c0,5.4,4.9,9.8,12.3,16.9L16,27.6l3.7-3.3C27.1,17.2,32,12.8,32,7.4C32,3.3,28.7,0,23.6,0z"/></svg>`,
            `<svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g2"><stop offset="0%" stop-color="#ff758f"/><stop offset="100%" stop-color="#ffccd5"/></linearGradient></defs><path fill="url(#g2)" d="M23.6,0c-3.4,0-6.3,1.4-8.3,3.7C13.7,1.4,10.8,0,7.4,0C3.3,0,0,3.3,0,7.4c0,5.4,4.9,9.8,12.3,16.9L16,27.6l3.7-3.3C27.1,17.2,32,12.8,32,7.4C32,3.3,28.7,0,23.6,0z"/></svg>`,
            `<svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g3"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffebee"/></linearGradient></defs><path fill="url(#g3)" d="M23.6,0c-3.4,0-6.3,1.4-8.3,3.7C13.7,1.4,10.8,0,7.4,0C3.3,0,0,3.3,0,7.4c0,5.4,4.9,9.8,12.3,16.9L16,27.6l3.7-3.3C27.1,17.2,32,12.8,32,7.4C32,3.3,28.7,0,23.6,0z"/></svg>`
        ];

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            const randomSVG = heartSVGs[Math.floor(Math.random() * heartSVGs.length)];
            heart.innerHTML = randomSVG;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 12 + 16) + 's';
            heart.style.animationDelay = Math.random() * 10 + 's';
            heart.style.width = (Math.random() * 12 + 16) + 'px';
            heart.style.height = heart.style.width;
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 30000);
        }

        let heartsInterval = null;
        function startHearts() {
            const container = document.getElementById('hearts-container');
            container.classList.add('active');
            for (let i = 0; i < 12; i++) createHeart();
            heartsInterval = setInterval(createHeart, 1800);
        }

        // GAME LOGIC
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const statusText = document.getElementById('status-text');
        const img = document.getElementById('valentine-img');
        const title = document.getElementById('main-title');
        const successMsg = document.getElementById('success-msg');
        const btnContainer = document.getElementById('btn-container');

        const noTexts = [
            "Are you sure?", "Really sure?", "Think again!", "Last chance!", "Surely not?",
            "You might regret this!", "Give it another thought!", "Are you absolutely certain?",
            "This could be a mistake!", "Have a heart!", "Don't be so cold!", "Change of heart?",
            "Wouldn't you reconsider?", "Is that your final answer?", "You're breaking my heart ;("
        ];

        let clickCount = 0;
        let isMoving = false;

        noBtn.addEventListener('click', () => {
            clickCount++;

            if (!isMoving) {
                noBtn.style.position = 'absolute';
                noBtn.style.transition = 'all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                isMoving = true;
            }

            statusText.textContent = noTexts[(clickCount - 1) % noTexts.length];
            statusText.classList.add('visible');

            const randomX = Math.random() * 80 - 40;
            const randomY = Math.random() * 70 - 35;
            const scale = Math.max(0.45, 1 - clickCount * 0.09);

            noBtn.style.left = '50%';
            noBtn.style.top = '50%';
            noBtn.style.transform = `translate(-50%, -50%) translate(${randomX}vw, ${randomY}vh) scale(${scale})`;
            noBtn.style.opacity = Math.max(0.55, 1 - clickCount * 0.055);

            if (clickCount >= 5) noBtn.classList.add('shake');

            const yesScale = Math.min(1.6, 1 + clickCount * 0.09);
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        yesBtn.addEventListener('click', () => {
            img.src = imgConfig.yayGif;
            updateBackground('happy');

            title.style.display = 'none';
            successMsg.style.display = 'block';
            btnContainer.style.display = 'none';
            statusText.style.display = 'none';

            startHearts();
            fireConfetti();

            // WHATSAPP RANDOM MESSAGE & REVEAL (FIXED EMOJI VERSION)
            const waMessages = [
                "I just said Yes to being your Val… so when are you taking me out? 😏❤️",
                "Your little 'Will you be my Val?' trap just worked… now what? 😳💕",
                "Okay fine, Yes clicked… happy now? 🥰 Come claim your Valentine ❤️",
                "Yes accepted. Heart racing already… your move 💓💘",
                "I said Yes… don’t leave me hanging now 👀 What’s next? 🔥",
                "Done. Officially your Val. Where’s my prize? 😏🫶",
                "Clicked Yes… so hi, your Val is reporting for duty 😌❤️",
                "You actually got me to say Yes… now you owe me attention forever 😤💕"
            ];

            const randomText = waMessages[Math.floor(Math.random() * waMessages.length)];

            /// Favicon switcher on Yes (cache-safe)
setTimeout(() => {
    const faviconLink = document.getElementById('favicon');
    const timestamp = Date.now();

    if (faviconLink) {
        faviconLink.href = `valentine.jpg?v=${timestamp}`;
        faviconLink.type = 'image/png';
    }

    const appleLink = document.querySelector('link[rel="apple-touch-icon"]');
    if (appleLink) {
        appleLink.href = `valentine.jpg?v=${timestamp}`;
    }
}, 1200);
 // delay ~1.2s so it syncs nicely with confetti + hearts reveal


            // FIXED: Use URLSearchParams for safe emoji encoding
            const params = new URLSearchParams();
            params.append('text', randomText);

            document.getElementById('whatsapp-btn').href = `https://wa.me/2349074935326?${params.toString()}`;

            const prompt = document.getElementById('whatsapp-prompt');
            prompt.style.display = 'block';
            setTimeout(() => prompt.classList.add('visible'), 800);
        });

        // CONFETTI
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle() {
            const colors = ['#e63946', '#c1121f', '#ffccd5', '#ffffff', '#ff758f', '#d00000'];
            const shapes = ['square', 'circle', 'heart'];
            return {
                x: window.innerWidth / 2,
                y: window.innerHeight / 2,
                size: Math.random() * 16 + 8,
                color: colors[Math.floor(Math.random() * colors.length)],
                shape: shapes[Math.floor(Math.random() * shapes.length)],
                vx: (Math.random() - 0.5) * 28,
                vy: (Math.random() - 0.5) * 28 - 10,
                gravity: 0.24,
                drag: 0.965,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 12,
                opacity: 1
            };
        }

        function drawHeart(x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size/2, -size/2, -size, size/3, 0, size);
            ctx.bezierCurveTo(size, size/3, size/2, -size/2, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        function fireConfetti() {
            for(let i = 0; i < 180; i++) particles.push(createParticle());
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.vx *= p.drag;
                p.vy *= p.drag;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.opacity -= 0.0045;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.globalAlpha = p.opacity;

                if (p.shape === 'heart') {
                    ctx.rotate(-p.rotation * Math.PI / 180);
                    drawHeart(0, 0, p.size, p.color);
                } else if (p.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size/2, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                }
                ctx.restore();

                if (p.opacity <= 0) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }
    </script>
</body>
</html>
